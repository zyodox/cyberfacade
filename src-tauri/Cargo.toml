[package]
name = "cyberfacade"
version = "0.1.0"
description = "Procedural animated building emission textures"
edition = "2021"

[lib]
name = "cyberfacade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
exr = "1.74"

[profile.dev]
# Keep incremental dev builds light on a weak CPU…
debug = 0

# …but always optimize the image encoders: unoptimized PNG/EXR compression is 10–50× slower.
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.exr]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zune-inflate]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
